name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate planning documents
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = Path("DOCS")
          expected = [Path("AGENTS.md"), docs / "README.md", docs / "DEVELOPMENT_PLAN.md", docs / "PHASE0_BASELINE.md", docs / "PHASE1_2_PROGRESS.md", docs / "PHASE3_4_CONTINUOUS.md", docs / "MODE_SEPARATION.md"]
          for file in expected:
              assert file.is_file(), f"Missing required document: {file}"
              content = file.read_text(encoding="utf-8")
              assert content.strip(), f"Empty document: {file}"
              assert content.count("`" * 3) % 2 == 0, f"Unbalanced fenced code blocks: {file}"
              for target in re.findall(r"\[[^\]]+\]\((\.?\.?/[^)#]+)(?:#[^)]+)?\)", content):
                  destination = (file.parent / target).resolve()
                  assert destination.is_file(), f"Broken Markdown link: {file} -> {target}"
          plan = (docs / "DEVELOPMENT_PLAN.md").read_text(encoding="utf-8")
          assert "PowerShell" in plan, "Missing current PowerShell direction"
          assert "CUI" in plan, "Missing current CUI direction"
          assert "TDD" in plan, "Missing project development cycle"
          print("Planning documents validated.")

      - name: Validate synthetic baseline fixtures
        run: python -m unittest discover -s tests/baseline -p 'test_*.py' -v

      - name: Validate PowerShell 5.1 syntax and progress helpers
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-progress.ps1

      - name: Validate NVENC AVIF parameters and PowerShell 5.1 syntax
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-gpu.ps1

      - name: Smoke test GPU entrypoints and unchanged small CBZ
        shell: pwsh
        run: python tests/powershell/smoke_gpu_passthrough.py

      - name: Smoke test personal updater with offline main archive
        shell: pwsh
        run: python tests/powershell/smoke_updater.py

      - name: Smoke test unchanged small CBZ copy
        shell: pwsh
        run: python tests/powershell/smoke_cbz.py

      - name: Validate literal input handling and UTF-8 BOM in PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-input.ps1

      - name: Smoke test continuous batches through BAT in PowerShell 5.1
        shell: pwsh
        run: python tests/powershell/smoke_continuous.py

      - name: Smoke test EPUB, ordering, naming and size regressions
        shell: pwsh
        run: python tests/powershell/smoke_regressions.py

      - name: Validate ZIP Store writer ZIP64 boundary and output protection
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-zip.ps1

      - name: Smoke test distinct manga and magazine BAT modes
        shell: pwsh
        run: python tests/powershell/smoke_modes.py

      - name: Validate experimental hybrid scheduler on PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-hybrid.ps1
