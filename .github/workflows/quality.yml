name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner's preinstalled shell only bootstraps this pinned distribution.
      - name: Install PowerShell 7.6.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '7.6.5'
          $asset = "PowerShell-$version-win-x64.zip"
          $release = "https://github.com/PowerShell/PowerShell/releases/download/v$version"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP "pwsh-$version"
          Invoke-WebRequest "$release/$asset" -OutFile $archive
          $hashFile = Join-Path $env:RUNNER_TEMP 'powershell-hashes.sha256'
          Invoke-WebRequest "$release/hashes.sha256" -OutFile $hashFile
          $hashes = Get-Content -LiteralPath $hashFile -Raw -Encoding utf8
          $pattern = '(?im)^([a-f0-9]{64})\s+\*?' + [regex]::Escape($asset) + '\s*$'
          $match = [regex]::Match($hashes, $pattern)
          if (-not $match.Success) { throw 'Missing official SHA-256 for PowerShell ZIP' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $match.Groups[1].Value) {
            throw 'PowerShell ZIP SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "BOOKCONVERTER_CI_PWSH=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed runtime and entrypoints
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.5' -or $PSHOME -ne $env:BOOKCONVERTER_CI_PWSH -or
              (Get-Command pwsh.exe).Source -ne (Join-Path $PSHOME 'pwsh.exe')) {
            throw 'CI must use the explicitly installed PowerShell 7.6.5'
          }
          ./tests/powershell/test-runtime.ps1

      - name: Validate GPU-led CPU calibration and selective no-duplicate retries
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-gpu-led.ps1

      - name: Validate planning documents
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = Path("DOCS")
          expected = [Path("AGENTS.md"), docs / "README.md", docs / "DEVELOPMENT_PLAN.md", docs / "PHASE0_BASELINE.md", docs / "PHASE1_2_PROGRESS.md", docs / "PHASE3_4_CONTINUOUS.md", docs / "MODE_SEPARATION.md", docs / "HYBRID_AVIF.md", docs / "POWERSHELL_7_6.md"]
          for file in expected:
              assert file.is_file(), f"Missing required document: {file}"
              content = file.read_text(encoding="utf-8")
              assert content.strip(), f"Empty document: {file}"
              assert content.count("`" * 3) % 2 == 0, f"Unbalanced fenced code blocks: {file}"
              for target in re.findall(r"\[[^\]]+\]\((\.?\.?/[^)#]+)(?:#[^)]+)?\)", content):
                  destination = (file.parent / target).resolve()
                  assert destination.is_file(), f"Broken Markdown link: {file} -> {target}"
          plan = (docs / "DEVELOPMENT_PLAN.md").read_text(encoding="utf-8")
          assert "PowerShell" in plan, "Missing current PowerShell direction"
          assert "CUI" in plan, "Missing current CUI direction"
          assert "TDD" in plan, "Missing project development cycle"
          print("Planning documents validated.")

      - name: Validate synthetic baseline fixtures
        run: python -m unittest discover -s tests/baseline -p 'test_*.py' -v

      - name: Validate one-time ANSI startup banner and plain fallback
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-banner.ps1

      - name: Validate PowerShell 7.6 syntax and progress helpers
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-progress.ps1

      - name: Validate NVENC AVIF parameters and PowerShell 7.6 syntax
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-gpu.ps1

      - name: Smoke test GPU entrypoints and unchanged small CBZ
        shell: pwsh
        run: python tests/powershell/smoke_gpu_passthrough.py

      - name: Smoke test personal updater with offline main archive
        shell: pwsh
        run: python tests/powershell/smoke_updater.py

      - name: Smoke test unchanged small CBZ copy
        shell: pwsh
        run: python tests/powershell/smoke_cbz.py

      - name: Validate literal input handling and UTF-8 in PowerShell 7.6
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-input.ps1

      - name: Smoke test continuous batches through BAT in PowerShell 7.6
        shell: pwsh
        run: python tests/powershell/smoke_continuous.py

      - name: Smoke test EPUB, ordering, naming and size regressions
        shell: pwsh
        run: python tests/powershell/smoke_regressions.py

      - name: Validate ZIP Store writer ZIP64 boundary and output protection
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-zip.ps1

      - name: Smoke test distinct manga and magazine BAT modes
        shell: pwsh
        run: python tests/powershell/smoke_modes.py

      - name: Validate concurrent GPU and CPU quality probes on PowerShell 7.6
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-concurrent-quality.ps1

      - name: Validate hybrid AVIF samples and integration on PowerShell 7.6
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/powershell/test-hybrid.ps1
