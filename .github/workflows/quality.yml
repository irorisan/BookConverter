name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate planning documents
        shell: python
        run: |
          from pathlib import Path
          import re

          docs = Path("DOCS")
          expected = [docs / "README.md", docs / "DEVELOPMENT_PLAN.md"]
          for file in expected:
              assert file.is_file(), f"Missing required document: {file}"
              content = file.read_text(encoding="utf-8")
              assert content.strip(), f"Empty document: {file}"
              assert content.count("`" * 3) % 2 == 0, f"Unbalanced fenced code blocks: {file}"
              for target in re.findall(r"\[[^\]]+\]\((\.?\.?/[^)#]+)(?:#[^)]+)?\)", content):
                  destination = (file.parent / target).resolve()
                  assert destination.is_file(), f"Broken Markdown link: {file} -> {target}"
          assert "Tauri 2" in expected[1].read_text(encoding="utf-8")
          assert "Rust" in expected[1].read_text(encoding="utf-8")
          print("Planning documents validated.")

      - name: Validate synthetic baseline fixtures
        run: python -m unittest discover -s tests/baseline -p 'test_*.py' -v
